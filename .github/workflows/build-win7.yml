name: Build SKA Billing EXE for Windows 7

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows-7:
    runs-on: windows-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Install Dependencies
        run: npm ci
        working-directory: ./ska-desktop

      - name: Build Electron App for Windows 7 (IA32)
        run: npm run build:win7
        working-directory: ./ska-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKA-Billing-Win7-Portable
          path: ./ska-desktop/release/*.exe
          retention-days: 30
