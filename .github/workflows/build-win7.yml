name: Build SKA Billing EXE for Windows 7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-7:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      # IMPORTANT: Do NOT use working-directory if files are in root.
      # If your package.json is in the root of the repo, just run npm ci directly.
      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App for Windows 7 (IA32)
        # Ensure this command matches your package.json script exactly
        run: npm run build:win7

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKA-Billing-Win7-Portable
          # Look for exe in release folder from ROOT
          path: ./release/*.exe 
          retention-days: 30
